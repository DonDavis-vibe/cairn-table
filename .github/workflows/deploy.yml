name: Deploy to GitHub Pages

# Vite-Build -> GitHub Pages. Zusaetzlich wird der Kontaktblock des Impressums
# aus dem Secret IMPRESSUM_KONTAKT eingesetzt — er steht bewusst NICHT im Repo,
# damit Name/Anschrift/E-Mail nicht in Klons, Forks oder der Git-History landen.
#
# Einmalige Einrichtung (GitHub-Weboberflaeche):
#   1. Settings -> Secrets and variables -> Actions -> New repository secret
#      Name:  IMPRESSUM_KONTAKT
#      Wert:  der fertige HTML-Kontaktblock (Vorlage: .github/KONTAKT.beispiel.html)
#   2. Settings -> Pages -> Source: "GitHub Actions"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Kontaktdaten ins Impressum einsetzen
        env:
          IMPRESSUM_KONTAKT: ${{ secrets.IMPRESSUM_KONTAKT }}
        run: python3 .github/inject-kontakt.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
