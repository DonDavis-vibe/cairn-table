<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2f6f66" />
    <script>
      // Theme vor dem ersten Paint setzen (kein Flackern).
      try {
        var p = localStorage.getItem('cairn-table-theme');
        var dark = p === 'dark'
          || ((!p || p === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) { /* privater Modus */ }
    </script>

    <!-- Schriften werden selbst gehostet (src/assets/fonts/) — kein externer Aufruf. -->

    <title>Cairn Table — Cairn character sheet, Warden dashboard &amp; multiplayer</title>

  <body>
    <div id="root"></div>
    <noscript>
      <h1>Cairn Table — a character sheet and Warden dashboard for Cairn</h1>
      <p>
        Cairn Table is a free, open-source tool for the tabletop role-playing game
        <strong>Cairn</strong>. It runs entirely in your browser: build an adventurer following
        the rules, track Hit Protection, attributes, gold and scars, manage a ten-slot
        inventory, and roll saves. A serverless real-time multiplayer mode lets a Warden open a
        room and see every player's sheet live. No account, no server. English and German.
      </p>
      <p>
        Based on Cairn by Yochai Gal, used under CC-BY-SA 4.0.
